services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: switchyard
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./shared:/app/shared
    environment:
      DATABASE_URL: postgresql://switchyard:devpassword@postgres:5432/switchyard
      REDIS_URL: redis://redis:6379

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    depends_on:
      - postgres
      - redis
    volumes:
      - ./scheduler:/scheduler
      - ./shared:/shared
    environment:
      DATABASE_URL: postgresql://switchyard:devpassword@postgres:5432/switchyard
      REDIS_URL: redis://redis:6379

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 3
    volumes:
      - ./worker:/worker
      - ./shared:/shared
      - ./workflows:/workflows
    environment:
      DATABASE_URL: postgresql://switchyard:devpassword@postgres:5432/switchyard
      REDIS_URL: redis://redis:6379

volumes:
  pg_data:
  redis_data: